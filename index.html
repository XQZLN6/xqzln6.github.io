<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="嵌入式软件工程师个人作品集：ESP32 项目、硬件开发、WiFi/WebSocket/FFT 等自研成果展示。">
  <title>个人作品集 | 嵌入式软件工程师</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ======================= 导航栏 ======================= -->
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#about" class="brand"><span id="brandName">你的名字</span><span class="brand-dot">.</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="navLinks">
        <a href="#about">关于我</a>
        <a href="#projects">项目</a>
        <a href="#skills">技能</a>
        <a href="#experience">经历</a>
        <a href="#contact">联系</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ======================= Hero / 关于我 ======================= -->
    <section id="about" class="hero">
      <div class="container hero-inner">
        <div class="hero-avatar" aria-hidden="true">
          <!-- 替换：把头像照片放到 assets/avatar.jpg，或删掉这张图 -->
          <img src="assets/avatar.jpg" alt="个人头像" onerror="this.style.display='none'">
        </div>
        <div class="hero-text">
          <p class="hero-tag">你好，我是</p>
          <h1 id="heroName">你的名字</h1>
          <p class="hero-sub" id="heroSub">加载中…</p>
          <p class="hero-desc" id="heroIntro">加载中…</p>
          <div class="hero-actions">
            <a href="#projects" class="btn btn-primary">查看我的项目</a>
            <a href="#contact" class="btn btn-outline">联系我</a>
          </div>
          <div class="hero-links" id="heroLinks"></div>
        </div>
      </div>
    </section>

    <!-- ======================= 项目展示 ======================= -->
    <section id="projects" class="section">
      <div class="container">
        <h2 class="section-title">项目作品</h2>
        <p class="section-sub">点击可查看详情，每个项目都附演示与源码。</p>

        <!-- 项目卡片由 js/data/projects.js 渲染，加项目只改那个文件 -->
        <div class="project-grid" id="projectGrid"></div>
      </div>
    </section>

    <!-- ======================= 技能 ======================= -->
    <section id="skills" class="section section-alt">
      <div class="container">
        <h2 class="section-title">技能</h2>
        <p class="section-sub">按方向分类，诚实填写——面试官会顺着简历追问。</p>

        <!-- 技能由 js/data/skills.js 渲染 -->
        <div class="skill-grid" id="skillGrid"></div>
      </div>
    </section>

    <!-- ======================= 经历 / 教育 ======================= -->
    <section id="experience" class="section">
      <div class="container">
        <h2 class="section-title">教育与经历</h2>
        <p class="section-sub">简洁即可，详细版在简历里。</p>

        <!-- 经历由 js/data/experience.js 渲染 -->
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- ======================= 联系 ======================= -->
    <section id="contact" class="section section-alt">
      <div class="container contact-inner">
        <h2 class="section-title">联系我</h2>
        <p class="section-sub">欢迎秋招相关机会，随时联系：</p>
        <!-- 联系方式由 js/data/profile.js 渲染 -->
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footerName">你的名字</span> · 嵌入式软件工程师作品集</p>
      <p class="footer-note">Powered by 手写 HTML/CSS/JS · 部署于 GitHub Pages</p>
    </div>
  </footer>

  <!-- 数据文件：改内容只动这里，结构不用动 -->
  <script src="js/data/profile.js"></script>
  <script src="js/data/projects.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/experience.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
